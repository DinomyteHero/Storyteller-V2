metadata:
  display_name: Forgotten Realms
  time_period: 1492 DR (Year of Three Ships Sailing)
  calendar_note: "The Dale Reckoning calendar. The present era spans the aftermath of the Sundering."
  summary: >
    The continent of Faerûn, a land of ancient magic and forgotten gods, where the mundane
    and magical are inseparable. The great city of Waterdeep anchors the Sword Coast, while
    the Underdark churns beneath and the Far Realm presses against reality's edges.
    Adventurers fill the void left by gods and empires. Every ruin holds treasure; every
    treasure holds a curse.
  tone: High fantasy; ancient mysteries; heroic adventure with dark undertones.
  key_conflicts:
    - The Lords' Alliance vs. threats from the north and east.
    - Ancient evils stirring in ruins and forgotten temples.
    - Arcane guilds and thieves' guilds competing for power in Waterdeep.
  themes:
    - Power and its corrupting influence.
    - The weight of prophecy versus free will.
    - Redemption and the cost of heroism.
