templates: []
anchors:
  - id: npc-durnan
    name: Durnan
    role: innkeeper
    faction_id: neutral
    default_location_id: loc-sword_coast_inn
    home_locations:
      - loc-sword_coast_inn
    tags:
      - innkeeper
      - veteran
      - neutral
    traits:
      - gruff
      - pragmatic
      - secretly_compassionate
    motivation: Maintain the Yawning Portal and his hard-won peace.
    species: Human
    rarity: common
    relationships:
      - target_npc_id: npc-volothamp
        relationship_type: acquaintance
        strength: 40
    metadata:
      description: >
        The gruff, ageless proprietor of the Yawning Portal. A retired adventurer who made
        his fortune clearing the upper levels of Undermountain. He charges a gold piece to use
        the well and has seen a thousand adventurers go down and not come back.
      speech_style: Short sentences, occasional dark humor. Refers to death as the long rest.

  - id: npc-volothamp
    name: Volothamp Geddarm
    role: sage
    faction_id: neutral
    default_location_id: loc-bazaar_waterdeep
    home_locations:
      - loc-bazaar_waterdeep
    tags:
      - sage
      - writer
      - neutral
    traits:
      - garrulous
      - enthusiastic
      - occasionally_unreliable
    motivation: Gather stories, avoid danger, sell books.
    species: Human
    rarity: rare
    metadata:
      description: >
        The legendary travel writer and self-styled expert on all things monstrous. Volo
        is charming, garrulous, and frequently wrong about the details, though his broad
        strokes are usually accurate.
      speech_style: Exclamatory, prone to tangents, uses extraordinary and magnificent.

  - id: npc-harpers-agent
    name: Reiya Moonwhisper
    role: contact
    faction_id: harpers
    default_location_id: loc-adventurers_guild
    home_locations:
      - loc-adventurers_guild
    tags:
      - agent
      - spy
      - harpers
    traits:
      - perceptive
      - idealistic
      - cautious
    motivation: Protect the weak from tyranny; maintain the balance of power.
    species: Human
    rarity: uncommon
    relationships:
      - target_npc_id: npc-zhentarim-contact
        relationship_type: rival
        strength: 20
    metadata:
      description: >
        A half-elf Harper agent operating under cover as a guild administrator.
      speech_style: Measured, speaks obliquely about Harper business, careful with names.

  - id: npc-zhentarim-contact
    name: Davil Starsong
    role: fence
    faction_id: zhentarim
    default_location_id: loc-bazaar_waterdeep
    home_locations:
      - loc-bazaar_waterdeep
    tags:
      - merchant
      - fence
      - zhentarim
    traits:
      - charming
      - calculating
      - amoral
    motivation: Expand Zhentarim influence; personal enrichment.
    species: Human
    rarity: uncommon
    metadata:
      description: >
        A smooth Zhentarim operative who presents himself as a simple merchant.
      speech_style: Smooth, uses euphemisms for illegal activities.

  - id: npc-paladin-tyr
    name: Ser Vorthas Greymane
    role: quest_giver
    faction_id: order_gauntlet
    default_location_id: loc-temple_tyr
    home_locations:
      - loc-temple_tyr
    tags:
      - paladin
      - quest_giver
      - order_gauntlet
    traits:
      - stern
      - honorable
      - inflexible
    motivation: Defend the innocent; purge undead and fiends; honor Tyr's sacrifice.
    species: Human
    rarity: uncommon
    metadata:
      description: >
        A veteran paladin of Tyr who survived the Sundering. He is haunted by the gods he
        watched fall and consumed by duty to prevent another catastrophe.
      speech_style: Formal, archaic phrasing, never lies, frequently references Tyr's law.
