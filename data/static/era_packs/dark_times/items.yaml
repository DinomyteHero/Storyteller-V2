items:
  # Weapons
  - id: item-dl44-blaster
    name: DL-44 Heavy Blaster Pistol
    type: weapon
    rarity: common
    description: >
      A heavy blaster pistol favored by smugglers and rebels alike. Powerful,
      reliable, and just barely legal in most systems. Kicks hard and runs hot —
      the weapon of someone who expects close-range trouble.
    mechanics:
      difficulty_modifier: -1
      stat_bonus:
        Combat: 1
      weight_class: light
    value: 500
    tags: [ranged, blaster, one_handed, concealable]
    discoverable_at: [loc-black_market, loc-cantina, loc-arms_dealer]

  - id: item-e11-blaster-rifle
    name: E-11 Blaster Rifle
    type: weapon
    rarity: common
    description: >
      Standard-issue Imperial blaster rifle. Accurate at range, easily
      identifiable as Imperial equipment — carrying one without a uniform
      invites questions.
    mechanics:
      difficulty_modifier: -1
      stat_bonus:
        Combat: 1
      weight_class: medium
    value: 650
    tags: [ranged, blaster, two_handed, imperial_issue]
    discoverable_at: [loc-imperial_garrison]

  - id: item-vibroblade
    name: Vibroblade
    type: weapon
    rarity: common
    description: >
      A cortosis-weave combat blade with a vibration generator that allows it
      to cut through most armor. Silent, reliable, and unsettlingly intimate
      as a weapon of last resort.
    mechanics:
      difficulty_modifier: -1
      stat_bonus:
        Combat: 1
      weight_class: light
    value: 300
    tags: [melee, blade, concealable, silent]
    discoverable_at: [loc-black_market, loc-cantina]

  - id: item-bowcaster
    name: Wookiee Bowcaster
    type: weapon
    rarity: uncommon
    description: >
      A Wookiee-crafted energy crossbow that fires quarrels of ionite wrapped
      in plasma energy. Devastating at range. The tension required to prime it
      means non-Wookiees struggle to fire it without modification.
    mechanics:
      difficulty_modifier: -2
      stat_bonus:
        Combat: 2
      weight_class: heavy
      skill_requirement: Combat >= 3
    value: 1200
    tags: [ranged, bowcaster, two_handed, wookiee_made, high_damage]
    discoverable_at: [loc-black_market]

  # Armor and Protection
  - id: item-blast-vest
    name: Blast Dampening Vest
    type: armor
    rarity: common
    description: >
      A padded vest with blast-dampening panels. Won't stop a direct hit from
      a blaster rifle but dramatically improves survival odds against glancing
      shots and shrapnel.
    mechanics:
      difficulty_modifier: 0
      stat_bonus:
        Combat: 0
      weight_class: light
    value: 400
    tags: [armor, light, concealable]
    metadata:
      hp_bonus: 2
    discoverable_at: [loc-black_market, loc-arms_dealer]

  - id: item-stormtrooper-armor
    name: Stormtrooper Armor (Set)
    type: armor
    rarity: uncommon
    description: >
      A full set of white plastoid stormtrooper armor, either stolen or stripped
      from a fallen Imperial. Provides solid protection but wearing it outside
      an Imperial garrison makes you a very visible target for Rebels — and
      inside an Imperial base, it only works until someone checks your ID.
    mechanics:
      difficulty_modifier: 1
      stat_bonus:
        Combat: 1
      weight_class: heavy
    value: 0
    tags: [armor, heavy, imperial_disguise, conspicuous]
    metadata:
      hp_bonus: 4
    discoverable_at: [loc-imperial_garrison]

  # Tools and Utilities
  - id: item-slicers-kit
    name: "Slicer's Kit"
    type: tool
    rarity: common
    description: >
      A collection of dataspikes, bypass modules, and a portable cracker system.
      The professional's toolkit for breaking into Imperial computer systems.
      Illegal to possess in most Imperial-controlled sectors.
    mechanics:
      difficulty_modifier: -1
      stat_bonus:
        Tech: 1
      weight_class: light
    value: 800
    tags: [tool, tech, hacking, illegal]
    discoverable_at: [loc-black_market, loc-cantina]

  - id: item-medpac
    name: Medpac
    type: consumable
    rarity: common
    description: >
      A compact field medical kit with bacta patches, stims, and a coagulant
      spray. Can stabilize a critical wound in the field. One use per medpac.
    mechanics:
      difficulty_modifier: 0
      consumable: true
      uses: 1
    value: 150
    tags: [consumable, medical, healing]
    metadata:
      hp_restore: 3
    discoverable_at: [loc-cantina, loc-black_market, loc-safe_house]

  - id: item-stimpack
    name: Stimpack (Military Grade)
    type: consumable
    rarity: uncommon
    description: >
      A combat stimulant injector that temporarily enhances reaction time and
      suppresses pain. Used by clone troopers and now black-marketed heavily
      post-war. The crash hits hard about an hour later.
    mechanics:
      difficulty_modifier: -1
      consumable: true
      uses: 1
    value: 350
    tags: [consumable, stimulant, military, one_use]
    metadata:
      combat_bonus_turns: 3
      stress_delta: 5
    discoverable_at: [loc-black_market]

  # Documents and Key Items
  - id: item-forged-imperial-papers
    name: Forged Imperial Travel Permit
    type: document
    rarity: uncommon
    description: >
      High-quality forged documentation identifying the bearer as an authorized
      Imperial civilian contractor. Will pass casual inspection. Won't survive
      a direct Imperial Security Bureau scan.
    mechanics:
      difficulty_modifier: -1
      weight_class: light
    value: 1500
    tags: [document, forged, imperial, identity]
    discoverable_at: [loc-black_market]

  - id: item-stolen-imperial-intel
    name: Stolen Imperial Data Chip
    type: key
    rarity: rare
    description: >
      An encrypted Imperial data chip recovered from an unknown source. The
      encryption is Imperial grade — breaking it requires either a serious
      slicer or an ISB decryption terminal. What's on it is anyone's guess.
      Someone clearly wanted it badly enough to risk a lot to steal it.
    mechanics:
      difficulty_modifier: 0
      weight_class: light
    value: 0
    tags: [key_item, imperial, encrypted, plot_item]
    discoverable_at: []

  - id: item-jedi-holocron-fragment
    name: Jedi Holocron Fragment
    type: key
    rarity: legendary
    description: >
      A shard of a shattered Jedi holocron — a crystalline data storage device
      once used to preserve Jedi knowledge. This piece still hums faintly to
      those sensitive to the Force. The Inquisitors hunt anyone who possesses
      such relics. The knowledge within, if retrievable, could be invaluable.
    mechanics:
      difficulty_modifier: 0
      weight_class: light
    value: 0
    tags: [key_item, jedi, force_sensitive, legendary, dangerous_to_carry]
    discoverable_at: []
