# ============================================================
# era.yaml — Era Pack Manifest (TEMPLATE) — V6.0 Minimal
# ============================================================
#
# PURPOSE:
#   Root manifest file for an era pack. Declares the era ID, schema version,
#   and the three files needed for character creation. Also defines starting
#   location archetypes and display metadata.
#
# USED BY:
#   - Era pack loader (backend/app/world/era_pack_loader.py)
#   - CampaignBibleAgent (reads start_location_pool, legends_timeline / setting_timeline)
#   - BiographerAgent (reads start_location_pool, metadata, setting_rules)
#   - Director & Narrator (reads metadata.tone, metadata.themes for prompt context)
#
# V6.0 DESIGN:
#   Era packs contain ONLY character creation essentials (3 files: era, backgrounds, species).
#   All campaign content (NPCs, companions, factions, locations, quests) is generated ONCE
#   at campaign creation by CampaignBibleAgent and stored in campaigns.campaign_bible_json.
#   This makes adding a new era pack a single afternoon of work instead of months of content.
#
# INSTRUCTIONS:
#   1. Copy this entire _template/ directory to data/static/era_packs/<your_era_key>/
#   2. Replace "_TEMPLATE" with your era key (UPPERCASE: REBELLION, OLD_REPUBLIC, etc.)
#   3. Fill in metadata, legends_timeline (or setting_timeline), and setting_rules
#   4. Author backgrounds.yaml (CYOA questions) and species.yaml (playable species)
#   5. Run the test suite: python -m pytest backend/tests/ -k "era_pack" -q --tb=short
#
# GOTCHAS:
#   - file_index keys MUST exactly match: era, backgrounds, species
#   - start_location_pool IDs are canonical archetypes (e.g., loc-cantina), NOT specific locations
#     CampaignBibleAgent will generate named locations based on these archetypes
#   - era_id should be UPPERCASE by convention (e.g., REBELLION, OLD_REPUBLIC)
#   - style_ref path is relative to the project root (or null)
#   - For Star Wars Legends settings: use legends_timeline block
#   - For other settings: use setting_timeline block (different keys, same purpose)
# ============================================================

# --- REQUIRED: Unique era identifier (UPPERCASE convention) ---
era_id: _TEMPLATE

# --- Schema version (current: 3) ---
schema_version: 3

# --- Optional: path to a prose style guide for this era ---
# The Narrator uses this to match tone and vocabulary.
style_ref: null

# --- REQUIRED: Maps logical file names to actual filenames ---
# V6.0: Only three files needed for character creation.
file_index:
  era: era.yaml
  backgrounds: backgrounds.yaml
  species: species.yaml

# --- REQUIRED: Canonical location archetypes eligible as starting positions ---
# These are archetype IDs, not specific named locations.
# CampaignBibleAgent generates named versions of these for each campaign.
# Use generic IDs like loc-cantina, loc-tavern, loc-docking-bay, loc-marketplace.
start_location_pool:
  - loc-main-hub
  - loc-secondary-hub

# --- Freeform metadata (display info for the frontend and prompt context) ---
metadata:
  # display_name: shown in the era selection UI
  display_name: "Template Era"

  # time_period: narrative time range for this era
  time_period: "XXXX - XXXX BBY/ABY"

  # calendar_note: optional clarification of the era's dating system
  calendar_note: "Brief note about when this era takes place relative to major events."

  # summary: 3-5 sentence overview of the era (used in Director/Narrator prompts)
  summary: >
    A brief summary of the era. Describe the political landscape, major conflicts,
    and the state of the world. This text is injected into Director and Narrator
    prompts to set the tone.

  # tone: short phrase describing the era's emotional register
  tone: "Descriptive tone phrase; e.g., Gritty hope; dark intrigue; mythic grandeur."

  # key_conflicts: list of 2-4 major tensions driving stories in this era
  key_conflicts:
    - "Faction A vs. Faction B: describe the core struggle."
    - "Internal tension: describe a secondary conflict."

  # themes: list of 2-4 thematic throughlines
  themes:
    - "Theme one: e.g., Sacrifice and duty."
    - "Theme two: e.g., The cost of power."

# --- Timeline reference block ---
# Used by CampaignBibleAgent to generate era-accurate campaign content.
# CHOOSE ONE:
#
# For Star Wars Legends settings → use legends_timeline:
legends_timeline:
  era_start: "XX BBY/ABY (name of the opening event)"
  era_end: "XX BBY/ABY (name of the closing event)"
  key_events:
    - "XX BBY: Event name — brief description"
    - "XX BBY: Event name — brief description"
  galactic_state: >
    2-3 sentences describing the political/military state of the galaxy at era start.
    What factions hold power? What is the major threat? Who are the powerless?
  notable_locations:
    - "Location Name (brief context)"
    - "Location Name (brief context)"
  notable_figures:
    - "Character Name (role/faction)"
    - "Character Name (role/faction)"

# For non-Star-Wars settings → replace legends_timeline with setting_timeline:
# setting_timeline:
#   era_label: "1492 DR (Year of Three Ships Sailing)"
#   calendar_system: "Dale Reckoning (DR)"
#   key_events:
#     - "XXXX: Event — description"
#   world_state: >
#     Political/world state description.
#   notable_locations:
#     - "Location Name (context)"
#   notable_figures:
#     - "Character Name (role)"

# Optional: historical canon-character proximity rules.
# canon_characters:
#   - name: "Canonical Character"
#     proximity: cameo   # cameo | interaction | exclusion
#     locations: [loc-main-hub]
#     exclusion_events: ["Event Name Where Player Must Be Redirected"]

# --- V3.2: Universe rules (SettingRules) ---
# These fields control all setting-specific text in agent prompts.
# Fill them in to prevent cross-universe contamination (e.g., no lightsabers in D&D).
setting_rules:
  # The human-readable name of this setting/universe
  setting_name: "Your Setting Name"
  # Genre label for prompts (e.g., "science fantasy", "high fantasy", "urban fantasy")
  setting_genre: "genre"
  # Role descriptions injected into agent system prompts:
  biographer_role: "a biographer for a [Your Setting] narrative RPG"
  architect_role: "the World Architect for a [Your Setting] narrative RPG"
  director_role: "the Director for an interactive [Your Setting] story engine"
  suggestion_style: "a [Your Setting]-style game"
  # Common species/races that NPCs and players can be:
  common_species: ["Human"]
  # Major factions — used in faction-neutrality prompts and bible generation:
  example_factions: ["Faction A", "Faction B", "Faction C"]
  # Label for historical lore in HISTORICAL campaign mode:
  historical_lore_label: "established [Your Setting] lore"
  # Setting-specific bypass methods for access points (e.g., magic, force, pick_lock):
  bypass_methods: []
  # Fallback background text when character creation fails:
  fallback_background: "A traveler in a vast world."
