# Rule System Catalog
#
# Registry of all available rule systems. Each entry links a rule_system_id to its
# .md document in this directory, its stat schema, and which settings use it.
#
# To add a new rule system:
#   1. Copy _template.md → {rule_system_id}.md and fill in all required sections
#   2. Add an entry here
#   3. Reference the rule_system_id in the relevant setting.yaml (setting_packs/core/{setting_id}/setting.yaml)
#   4. (Optional) Ingest the rules into LanceDB for RAG retrieval:
#      python -m ingestion.ingest_rules --input data/static/rule_systems/{id}.md \
#        --rule-system {id} --setting-id {setting_id}

rule_systems:

  - id: storyteller_core
    display_name: "Storyteller Core"
    description: >
      Default narrative dice system designed for LLM-driven RPGs. Setting-agnostic;
      works for any science-fantasy, space opera, or genre-fiction universe.
      Uses a 6-stat schema with Triumph/Success/Threat/Despair spectrum outcomes.
    version: "2.0"
    stat_schema:
      - name: Presence
        governs: "Social actions — persuasion, deception, leadership, intimidation"
      - name: Cunning
        governs: "Stealth, trickery, sleight of hand, tactical maneuvering"
      - name: Physique
        governs: "Melee combat, athletics, endurance, brute-force tasks"
      - name: Intellect
        governs: "Technical skills, medicine, hacking, investigation, piloting"
      - name: Willpower
        governs: "Resistance to fear, corruption, mental strain, moral resolve"
      - name: Force
        governs: "Force sensitivity, perception, intuition, supernatural effects"
    settings_using:
      - star_wars
    doc_file: "storyteller_core.md"

